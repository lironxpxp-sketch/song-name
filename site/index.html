<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Piano Guess</title>
<meta name="theme-color" content="#14121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano Guess">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14121c; --panel:#1f1c2b; --panel2:#2a2639; --ink:#f4f1ea; --dim:#a39fb3;
  --gold:#f2c14e; --gold2:#e0a526; --good:#4fd18b; --bad:#ff6b6b; --key:#f8f5ee;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Rubik,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100%;padding:calc(16px + var(--safe-t)) 18px calc(18px + var(--safe-b));
  display:flex;flex-direction:column}
section{flex:1;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.btn{background:var(--gold);color:#1b1608;font-weight:700;font-size:19px;border-radius:16px;
  padding:16px 20px;width:100%;box-shadow:0 4px 0 var(--gold2);transition:transform .08s}
.btn:disabled{opacity:.4}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #191624}
.link{color:var(--dim);font-size:15px;padding:10px;text-decoration:underline;text-underline-offset:3px}

/* home */
.keys{display:flex;height:84px;margin:28px auto 8px;width:230px;position:relative}
.keys i{flex:1;background:var(--key);margin:0 2px;border-radius:0 0 7px 7px;animation:press 2.4s infinite}
.keys b{position:absolute;top:0;width:22px;height:52px;background:#0b0a10;border-radius:0 0 5px 5px;z-index:1}
.keys i:nth-child(2){animation-delay:.3s}.keys i:nth-child(4){animation-delay:.9s}.keys i:nth-child(6){animation-delay:1.5s}
@keyframes press{0%,80%,100%{transform:none;background:var(--key)}88%{transform:translateY(3px);background:var(--gold)}}
h1{font-size:40px;font-weight:800;text-align:center;margin:18px 0 6px;letter-spacing:-.5px}
.sub{color:var(--dim);text-align:center;margin:0 0 28px;font-size:17px;line-height:1.4}
.langs{display:flex;background:var(--panel);border-radius:16px;padding:5px;margin-bottom:14px}
.langs button{flex:1;padding:14px 0;border-radius:12px;font-size:18px;font-weight:600;color:var(--dim)}
.langs button.on{background:var(--panel2);color:var(--ink)}
.status{color:var(--dim);text-align:center;font-size:15px;min-height:22px;margin:4px 0 18px}
.how{margin-top:auto;padding-top:26px;color:var(--dim);font-size:14.5px;line-height:1.55}
.how b{color:var(--ink);font-weight:500}

/* game */
.top{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:var(--dim)}
.top .x{font-size:26px;padding:4px 10px;margin:-4px -10px}
.top .pts{color:var(--gold);font-weight:700;font-size:17px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:10px 0}
.secs{font-size:15px;color:var(--dim)} .secs b{color:var(--ink);font-size:30px;font-weight:800;margin:0 4px}
.bar{display:flex;gap:3px;width:100%;height:12px;direction:ltr}
.bar span{flex:1;background:var(--panel2);border-radius:3px;position:relative;overflow:hidden}
.bar span.open{background:#4a4462}
.bar span i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left}
.play{width:118px;height:118px;border-radius:50%;background:var(--gold);box-shadow:0 6px 0 var(--gold2),0 0 0 10px #f2c14e14;
  display:grid;place-items:center;transition:transform .08s}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold2)}
.play svg{width:46px;height:46px;fill:#1b1608}
.more{background:var(--panel2);border-radius:999px;padding:11px 22px;font-weight:600;font-size:17px}
.more:disabled{opacity:.35}
.guess{position:relative;display:flex;gap:10px;align-items:stretch}
.guess input{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid transparent;
  border-radius:14px;padding:14px 14px;outline:none}
.guess input:focus{border-color:#4a4462}
.mic{width:56px;flex:none;border-radius:14px;background:var(--panel2);display:grid;place-items:center}
.mic svg{width:26px;height:26px;fill:var(--ink)}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ff6b6b33}}
.sugg{position:absolute;left:0;right:66px;bottom:calc(100% + 6px);background:var(--panel2);border-radius:14px;overflow:hidden;
  box-shadow:0 -8px 30px #0008}
[dir=rtl] .sugg{left:66px;right:0}
.sugg button{display:block;width:100%;text-align:start;padding:13px 14px;font-size:16px;border-bottom:1px solid #ffffff10}
.sugg button:active{background:#4a4462}
.feedback{min-height:24px;text-align:center;font-size:15px;color:var(--dim);margin:12px 0 2px}
.feedback.bad{color:var(--bad)} .feedback.live{color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.giveup{align-self:center}

/* reveal */
.reveal{align-items:center;text-align:center;justify-content:center;gap:6px}
.verdict{font-size:30px;font-weight:800;margin-bottom:6px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--dim);font-size:20px;font-weight:500}
.cover{width:min(64vw,260px);aspect-ratio:1;border-radius:18px;object-fit:cover;background:var(--panel);margin:12px 0;
  box-shadow:0 20px 50px #0009}
.title{font-size:25px;font-weight:700;line-height:1.2}
.artist{color:var(--dim);font-size:17px;margin-bottom:6px}
.gain{color:var(--gold);font-weight:700;font-size:17px}
.reveal .btn{margin-top:22px}
.playreal{color:var(--gold);font-weight:600;padding:8px}

/* summary */
.sum{align-items:center;text-align:center}
.big{font-size:64px;font-weight:800;color:var(--gold);margin:30px 0 0}
.list{width:100%;margin:22px 0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:8px;text-align:start}
.row img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--panel2)}
.row div{flex:1;min-width:0}.row div b,.row div small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--dim)} .row .p{font-weight:700;color:var(--gold)} .row .p.z{color:var(--dim)}
.sum .btn+.btn{margin-top:12px}
</style>
</head>
<body>
<div id="app">

  <section id="home">
    <div class="keys" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      <b style="left:24px"></b><b style="left:57px"></b><b style="left:123px"></b><b style="left:156px"></b><b style="left:189px"></b>
    </div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="langs">
      <button data-lang="en">English</button>
      <button data-lang="he">עברית</button>
    </div>
    <div class="status" id="status"></div>
    <button class="btn" id="start" data-t="start"></button>
    <div class="how" data-t="how"></div>
  </section>

  <section id="game" hidden>
    <div class="top">
      <button class="x" id="quit" aria-label="Quit">×</button>
      <span id="roundLbl"></span>
      <span class="pts" id="ptsLbl"></span>
    </div>
    <div class="stage">
      <div class="secs" id="secs"></div>
      <div class="bar" id="bar"></div>
      <button class="play" id="play" aria-label="Play">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="more" id="more" data-t="more"></button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="guess">
      <div class="sugg" id="sugg" hidden></div>
      <input id="input" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="mic" id="mic" aria-label="Say it">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
      </button>
    </div>
    <button class="link giveup" id="giveup" data-t="giveUp"></button>
  </section>

  <section id="reveal" class="reveal" hidden>
    <div class="verdict" id="verdict"></div>
    <img class="cover" id="cover" alt="">
    <div class="title" id="rTitle"></div>
    <div class="artist" id="rArtist"></div>
    <div class="gain" id="gain"></div>
    <button class="playreal" id="playReal" hidden></button>
    <button class="btn" id="next"></button>
    <button class="link" id="stay" data-t="stay"></button>
  </section>

  <section id="summary" class="sum" hidden>
    <div class="secs" data-t="final"></div>
    <div class="big" id="final"></div>
    <div class="list" id="list"></div>
    <button class="btn" id="again" data-t="again"></button>
    <button class="btn ghost" id="homeBtn" data-t="home"></button>
  </section>

</div>
<script src="match.js"></script>
<script src="app.js"></script>
</body>
</html>
