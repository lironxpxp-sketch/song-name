<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song Lab</title>
<meta name="theme-color" content="#14121c">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121c;--panel:#1f1c2b;--panel2:#2a2639;--ink:#f4f1ea;--dim:#a39fb3;--gold:#f2c14e;--good:#4fd18b;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 40px}
h1{font-size:26px;margin:8px 0 4px} p{color:var(--dim);margin:0 0 14px;line-height:1.45;font-size:15px}
.tabs{display:flex;gap:6px;background:var(--panel);border-radius:14px;padding:5px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 0;border-radius:10px;font:inherit;font-weight:600;color:var(--dim);background:none;border:0}
.tabs button.on{background:var(--panel2);color:var(--ink)}
.card{background:var(--panel);border-radius:14px;padding:12px;margin-bottom:10px}
.head{display:flex;gap:12px;align-items:center}
.head img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--panel2)}
.head b{display:block;font-size:16px} .head small{color:var(--dim)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.btns button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:11px 4px;
  background:var(--panel2);color:var(--ink)}
.btns button.playing{background:var(--gold);color:#1b1608}
.btns button:disabled{opacity:.3}
.meta{color:var(--dim);font-size:12.5px;margin-top:8px}
a{color:var(--gold)}
</style>
</head>
<body>
<main>
  <h1>Song Lab</h1>
  <p>Each song: the <b>game clip</b> (no vocals) and the <b>real</b> song, same part. Each plays 8 seconds. <a href="./">← Back to the game</a></p>
  <div class="tabs"><button data-l="he" class="on">עברית</button><button data-l="en">English</button></div>
  <div id="list"></div>
</main>
<script>
const audio = new Audio();
let current = null, timer = 0;

function stop() { audio.pause(); clearTimeout(timer); if (current) current.classList.remove("playing"); current = null; }

function play(btn, src, from) {
  if (current === btn) return stop();
  stop();
  if (!src) return;
  current = btn; btn.classList.add("playing");
  audio.src = src;
  audio.currentTime = from || 0;
  audio.play().catch(stop);
  timer = setTimeout(stop, 8000);
}

function deezerPreview(id) {
  return new Promise((resolve, reject) => {
    const cb = "dz_" + Math.random().toString(36).slice(2), s = document.createElement("script");
    window[cb] = (d) => { delete window[cb]; s.remove(); d.preview ? resolve(d.preview) : reject(); };
    s.onerror = reject;
    s.src = `https://api.deezer.com/track/${id}?output=jsonp&callback=${cb}`;
    document.head.appendChild(s);
  });
}

async function load(lang) {
  stop();
  const list = document.getElementById("list");
  list.innerHTML = "<p>Loading…</p>";
  const m = await (await fetch(`data/${lang}/manifest.json`, { cache: "no-cache" })).json();
  list.innerHTML = "";
  for (const s of m.songs) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<div class="head"><img alt=""><div><b></b><small></small></div></div>
      <div class="btns"><button data-k="old" hidden>Old</button><button data-k="new">Game clip</button><button data-k="real">Real</button></div>
      <div class="meta"></div>`;
    c.querySelector("img").src = s.cover || "";
    c.querySelector("b").textContent = s.title;
    c.querySelector("small").textContent = s.artist;
    const a = s.arrangement;
    c.querySelector(".meta").textContent = (s.method || "") +
      (s.info ? ` · chorus at ${s.info.source_offset}s · ${s.info.tempo} bpm` : "") +
      (a ? ` · ${a.melody_notes} melody notes · ${a.tempo} bpm` : "") +
      (s.status === "needs_review" ? " · ⚠️ needs review" : "");
    const [bOld, bNew, bReal] = c.querySelectorAll("button");
    const base = `data/${lang}/`;
    if (!s.piano_v1_file) bOld.disabled = true;
    bOld.onclick = () => play(bOld, base + s.piano_v1_file, 0);
    bNew.onclick = () => play(bNew, base + s.piano_file, 0);
    bReal.disabled = true;     // fetch the link now so the tap can play it right away (iPhone)
    deezerPreview(s.deezer_id).then((u) => { s.preview = u; bReal.disabled = false; }).catch(() => {});
    bReal.onclick = () => play(bReal, s.preview, s.piano_offset_sec || 0);
    list.appendChild(c);
  }
}

for (const b of document.querySelectorAll(".tabs button")) {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
    load(b.dataset.l);
  };
}
load("he");
</script>
</body>
</html>
