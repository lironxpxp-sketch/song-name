name: Make piano clips

on:
  workflow_dispatch:
    inputs:
      songs:
        description: "Library size per language (total songs, new ones are added)"
        default: "10"
      languages:
        description: "Languages (he, en or both)"
        type: choice
        options: ["he en", "he", "en"]
        default: "he en"
      variants:
        description: "Piano styles to try per song (more = better, slower)"
        default: "2"
      rebuild:
        description: "Remake ALL existing songs (after an improvement)"
        type: boolean
        default: false
      redo_ids:
        description: "Optional: Deezer IDs to regenerate, comma-separated (only these are done)"
        default: ""
      redo_lang:
        description: "Language of the IDs above"
        type: choice
        options: ["he", "en"]
        default: "he"

permissions:
  contents: write

concurrency: clips

jobs:
  clips:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SONGGAME_SAMPLES: /home/runner/piano-samples
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Check ffmpeg
        run: ffmpeg -version | head -1

      - name: Cache piano samples
        uses: actions/cache@v4
        with:
          path: ~/piano-samples
          key: salamander-v1

      - name: Get piano samples (Salamander Grand, via Tone.js)
        timeout-minutes: 5
        run: |
          mkdir -p ~/piano-samples && cd ~/piano-samples
          names="A0"; for o in 1 2 3 4 5 6 7; do names="$names C$o Ds$o Fs$o A$o"; done; names="$names C8"
          for n in $names; do
            [ -s "$n.mp3" ] || curl -fsSL --retry 3 -o "$n.mp3" "https://tonejs.github.io/audio/salamander/$n.mp3" || echo "missing $n"
          done
          ls | wc -l

      - name: Install Python packages
        run: |
          set -o pipefail
          pip install -r pipeline/requirements.txt 2>&1 | tail -40 | tee -a ~/run.log

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: models-v2

      - name: Self-test
        working-directory: pipeline
        run: |
          set -o pipefail
          { python tests/test_offline.py && python tests/test_melody.py; } 2>&1 | tee -a ~/run.log

      - name: Make clips
        working-directory: pipeline
        env:
          SONGS: ${{ inputs.songs }}
          LANGS: ${{ inputs.languages }}
          VARIANTS: ${{ inputs.variants }}
          REDO_IDS: ${{ inputs.redo_ids }}
          REDO_LANG: ${{ inputs.redo_lang }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -o pipefail
          {
          if [ "$REBUILD" = "true" ]; then
            for lang in $LANGS; do
              python -m songgame --out ../site/data build --lang "$lang" --all
            done
          elif [ -n "$REDO_IDS" ]; then
            python -m songgame --out ../site/data build --lang "$REDO_LANG" --ids "$REDO_IDS" --variants "$VARIANTS"
          else
            for lang in $LANGS; do
              echo "::group::$lang"
              python -m songgame --out ../site/data collect --lang "$lang"
              python -m songgame --out ../site/data build --lang "$lang" --limit "$SONGS" --variants "$VARIANTS"
              echo "::endgroup::"
            done
          fi
          for lang in he en; do
            if [ -f "../site/data/$lang/manifest.json" ]; then
              python -c "import json,sys;m=json.load(open(sys.argv[1]));print(sys.argv[2], m['count'], 'songs')" "../site/data/$lang/manifest.json" "$lang"
            fi
          done
          } 2>&1 | tee -a ~/run.log

      - name: Save clips to the repository
        if: always()
        run: |
          git config user.name "piano-clips-bot"
          git config user.email "piano-clips-bot@users.noreply.github.com"
          [ -f ~/run.log ] && cp ~/run.log last-run.log && git add last-run.log
          git add site/data
          git diff --cached --quiet && { echo "Nothing to save"; exit 0; }
          git commit -q -m "Piano clips run ${{ github.run_number }} (${{ job.status }})"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q

  publish:
    needs: clips
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
